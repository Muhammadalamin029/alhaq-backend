services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lel-store-api

    restart: unless-stopped

    env_file:
      - .env

    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

    ports:
      - "127.0.0.1:8100:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - lel-store-network

  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lel-store-celery

    restart: unless-stopped

    env_file:
      - .env

    command:
      [
        "celery",
        "-A",
        "core.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--queues=default,emails,notifications",
        "--prefetch-multiplier=1",
      ]

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - lel-store-network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lel-store-celery-beat

    restart: unless-stopped

    env_file:
      - .env

    command: ["celery", "-A", "core.celery_app", "beat", "--loglevel=info"]

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - lel-store-network

  postgres:
    image: postgres:16-alpine

    container_name: lel-store-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - lel-store-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - lel-store-network

  redis:
    image: redis:7-alpine

    container_name: lel-store-redis

    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - lel-store-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - lel-store-network

volumes:
  lel-store-postgres-data:
    name: lel-store-postgres-data

  lel-store-redis-data:
    name: lel-store-redis-data

networks:
  lel-store-network:
    name: lel-store-network
