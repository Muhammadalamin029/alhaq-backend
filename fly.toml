app = "alhaq-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 512

[deploy]
  strategy = "rolling"

[processes]
  app = "python start_celery_only.py 2"
  web = "uvicorn main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  processes = ["web"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
